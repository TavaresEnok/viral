# ==========================================================================
# Override OPCIONAL que liga a aceleração por GPU:
#   - worker: encode NVENC
#   - node-agent: transcrição Whisper na placa (serviço que só existe aqui)
#
# NÃO use este arquivo sozinho: ele é aplicado POR CIMA do compose de deploy,
# e apenas quando há GPU utilizável. Quem decide isso é o
# infra/scripts/viralforge-up.sh, que detecta a placa antes de subir.
#
#   # com GPU (o script faz isso sozinho):
#   docker compose -p viralforge --env-file infra/.env.deploy \
#     -f infra/docker-compose.deploy.yml -f infra/docker-compose.gpu.yml up -d
#
# Aplicar este override numa máquina SEM placa faz o container falhar ao subir
# — por isso a detecção fica no script, e não aqui.
#
# Sem GPU, o node-agent simplesmente não sobe e o worker nem tenta usá-lo
# (REMOTE_ACCEL_ENABLED só é definido aqui): a transcrição segue pelo caminho
# local/API de sempre.
# ==========================================================================
services:
  worker:
    environment:
      # `video` é obrigatório para o NVENC funcionar — só `compute` não basta.
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
      # Transcrição na GPU via node-agent (mesma rede interna do compose).
      REMOTE_ACCEL_ENABLED: "true"
      REMOTE_ACCEL_BASE_URL: http://node-agent:9873
      REMOTE_ACCEL_TOKEN: ${NODE_KEY:?NODE_KEY é obrigatório para o node-agent}
      REMOTE_ACCEL_MODEL: ${REMOTE_ACCEL_MODEL:-turbo}
      REMOTE_ACCEL_DEVICE: cuda
      REMOTE_ACCEL_COMPUTE_TYPE: ${REMOTE_ACCEL_COMPUTE_TYPE:-float16}
      # Transcrição em lote: na GPU, processar vários trechos por vez é
      # muito mais rápido que um a um. Em CPU isso não ajudaria.
      REMOTE_ACCEL_BATCH_SIZE: ${REMOTE_ACCEL_BATCH_SIZE:-8}
      # Com o encode saindo da CPU para o NVENC, dá para renderizar mais
      # cortes em paralelo sem competir com o DRAC pela CPU.
      RENDER_CLIP_CONCURRENCY: ${RENDER_CLIP_CONCURRENCY_GPU:-2}
      # Ajustes do NVENC. Sem repassar aqui, o codigo le process.env e nunca
      # encontra nada — NVENC_CQ e NVENC_PRESET eram documentados como
      # ajustaveis mas jamais chegavam ao container.
      # Vazio ativa a deteccao automatica no codigo (av1 -> hevc -> h264).
      # Preencher fixa um codec: h264_nvenc e o mais compativel.
      NVENC_CODEC: ${NVENC_CODEC:-}
      NVENC_PRESET: ${NVENC_PRESET:-p4}
      NVENC_CQ: ${NVENC_CQ:-}
      # false volta os filtros do layout padrao pra CPU sem tocar no encode
      # NVENC. O codigo ja assume "true" quando ausente, mas listar aqui
      # permite desligar por env sem rebuild (a licao do NVENC_CQ: variavel
      # nao listada aqui nunca chega ao container, nao importa o que o
      # codigo assuma como padrao).
      RENDER_GPU_FILTERS: ${RENDER_GPU_FILTERS:-true}
    depends_on:
      node-agent:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video]

  node-agent:
    build:
      context: ..
      dockerfile: node_agent/Dockerfile
    container_name: viralforge-node-agent
    # Sem porta publicada: só o worker fala com ele, pela rede interna.
    cpus: 2.0
    mem_limit: 4096m
    environment:
      NODE_KEY: ${NODE_KEY:?}
      NODE_MODEL: ${REMOTE_ACCEL_MODEL:-turbo}
      NODE_DEVICE: cuda
      NODE_COMPUTE_TYPE: ${REMOTE_ACCEL_COMPUTE_TYPE:-float16}
      # Carrega o modelo na VRAM já no boot, para o primeiro vídeo do dia não
      # pagar o custo de carregamento. O download em si acontece uma única vez
      # e fica no volume, então o boot continua rápido.
      NODE_PREWARM: ${NODE_PREWARM:-true}
      # O padrão do app é descarregar o Whisper da VRAM após cada job — e nesse
      # modo ele IGNORA o prewarm (não faz sentido carregar no boot para o
      # primeiro job descarregar). Mantendo residente, todo vídeo entra direto
      # na transcrição. Custa ~2GB dos 16GB de VRAM.
      NODE_UNLOAD_ASR_AFTER_USE: ${NODE_UNLOAD_ASR_AFTER_USE:-false}
      NODE_MAX_CONCURRENT: ${NODE_MAX_CONCURRENT:-2}
      # Detecção facial na GPU via insightface/ONNX (backend "scrfd", ~300MB
      # de imagem, sem torch — a decisão anterior de deixar isso de fora
      # citava o stack YOLO/torch, ~3GB, que não é o caminho usado aqui).
      # O worker chama /v1/track-faces com fallback automático pro binário
      # C++ local (CPU) se a GPU falhar ou o serviço estiver fora do ar.
      NODE_FACE_TRACKING_ENABLED: "true"
      NODE_FACE_BACKEND: scrfd
      NODE_FACE_DEVICE: cuda
      NODE_FACE_PREWARM: "true"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - node-agent-models:/models
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  node-agent-models:
    name: viralforge_node_agent_models
